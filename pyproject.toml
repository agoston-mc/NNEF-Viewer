[project]
name = "nnef-viewer"
version = "0.1.0"
description = "NNEF Binary Tensor Editor and Matrix Viewer (PySide6)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pyside6>=6.5.0",
    "nnef>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
]

[project.scripts]
nnef-viewer = "nnef_viewer.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnef_viewer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
